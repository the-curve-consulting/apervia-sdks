name: Node

on:
  push:
    paths:
      - "node/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "node/**"
      - ".github/workflows/node.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test
